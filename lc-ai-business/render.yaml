# Blueprint de Render.com: web service (Docker) + PostgreSQL.
services:
  - type: web
    name: lc-ai-business
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: PUBLIC_URL, sync: false }          # https://ai.tu-dominio.com
      - { key: DATABASE_URL, fromDatabase: { name: lc-ai-db, property: connectionString } }
      - { key: DATABASE_SSL, value: "true" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, generateValue: true }
      - { key: MP_ACCESS_TOKEN, sync: false }
      - { key: MP_WEBHOOK_SECRET, sync: false }
      - { key: SUPERADMIN_EMAIL, sync: false }
      - { key: SUPERADMIN_PASSWORD, sync: false }
      - { key: AUTO_SEED, value: "true" }          # crea planes, demo, plantillas y SUPER ADMIN en el primer arranque (idempotente)
      - { key: AI_PROVIDER, value: mock }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
databases:
  - name: lc-ai-db
    databaseName: lc_ai_business
    user: lc_ai
